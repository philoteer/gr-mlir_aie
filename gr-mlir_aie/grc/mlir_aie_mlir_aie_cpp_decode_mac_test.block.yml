id: mlir_aie_mlir_aie_cpp_decode_mac_test
label: Decode MAC Test
category: '[mlir_aie]'
templates:
  imports: from gnuradio import mlir_aie
  make: mlir_aie.mlir_aie_cpp_decode_mac_test(${path_xclbin}, ${path_insts_bin}, ${kernel_name})
parameters:
- id: path_xclbin
  label: XCLBIN path
  dtype: file_open
  default: build/final.xclbin
- id: path_insts_bin
  label: Instructions path
  dtype: file_open
  default: build/insts.bin
- id: kernel_name
  label: Kernel name
  dtype: string
  default: MLIR_AIE
inputs:
- domain: stream
  dtype: byte
  vlen: 48
outputs:
- domain: message
  id: out
documentation: |-
  Stateful NPU deinterleave/depuncture/Viterbi/descramble/CRC decoder.
  Accepts uint8[48] constellation decisions and equalizer tags. Publishes
  CRC-valid MAC PDUs, preserving original tags except iqdata and adding dlt=105.
  Uses the standalone decode_mac kernel (1024-byte input, 16 symbols per tile).
file_format: 1
