id: mlir_aie_mlir_aie_cpp_tagged_int64_to_int64
label: mlir_aie_cpp_tagged_int64_to_int64
category: '[mlir_aie]'

templates:
  imports: from gnuradio import mlir_aie
  make: mlir_aie.mlir_aie_cpp_tagged_int64_to_int64(${path_xclbin}, ${path_insts_bin}, ${kernel_name}, ${VECTOR_SIZE}, ${num_slots}, ${N_TILES}, ${preprocess}, ${nominal_frequency}, ${channel_estimate})

parameters:
- id: path_xclbin
  label: path_xclbin
  dtype: file_open
  default: 'aie-kernel-src/build/final.xclbin'

- id: path_insts_bin
  label: path_insts_bin
  dtype: file_open
  default: 'aie-kernel-src/build/insts.bin'

- id: kernel_name
  label: kernel_name
  dtype: string
  default: 'MLIR_AIE'

- id: VECTOR_SIZE
  label: VECTOR_SIZE
  dtype: int
  default: 4096

- id: num_slots
  label: Number of slots
  dtype: int
  default: 1

- id: N_TILES
  label: Number of Tiles
  dtype: int
  default: 4

- id: preprocess
  label: Frame-equalizer preprocess ABI
  dtype: bool
  default: 'False'

- id: nominal_frequency
  label: Nominal frequency (Hz)
  dtype: real
  default: 2.417e9
  hide: ${ 'none' if preprocess else 'all' }

- id: channel_estimate
  label: Frame-equalizer channel estimation ABI
  dtype: bool
  default: 'False'

inputs:
- label: in
  domain: stream
  dtype: s64

outputs:
- label: out
  domain: stream
  dtype: s64

file_format: 1
